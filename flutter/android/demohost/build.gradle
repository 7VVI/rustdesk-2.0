plugins {
    id "com.android.application"
    id "kotlin-android"
}

// Consume the standalone RDSDK distribution (packaged AAR), exactly like an
// external host app would -- NOT the :rdsdk source module.
def rdsdkDist = new File("/opt/rustdesk/rdsdk-dist")
def rdsdkRepo = new File(rdsdkDist, "m2repository")
def rdsdkLibs = new File(rdsdkDist, "libs")

repositories {
    google()
    mavenCentral()
    maven { url = "https://jitpack.io" }                                  // XXPermissions
    maven { url = "https://storage.googleapis.com/download.flutter.io" }   // Flutter engine .so
    maven { url = rdsdkRepo.toURI().toString() }                          // flutter_release + plugins
    maven {                                                                // rustls (artifact-only metadata)
        url = rdsdkRepo.toURI().toString()
        metadataSources.artifact()
        content { includeGroup "rustls" }
    }
    flatDir { dirs rdsdkLibs.path }                                       // rdsdk-release.aar
}

android {
    namespace "com.example.rddemo"
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.example.rddemo"
        minSdkVersion 22
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            // Use the debug keystore so we can assemble a signed release APK
            // for verification without provisioning a real keystore.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}

dependencies {
    // Consume the packaged SDK aar (bare aar, no POM) and declare its runtime
    // dependencies explicitly, mirroring rdsdk-dist/README.md.
    implementation(name: 'rdsdk-release', ext: 'aar')
    implementation "com.carriez.rdflutter:flutter_release:1.0"
    implementation "com.google.protobuf:protobuf-javalite:3.20.1"
    implementation "androidx.media:media:1.6.0"
    implementation "com.github.getActivity:XXPermissions:18.5"
    implementation "com.caverock:androidsvg-aar:1.4"
    implementation "rustls:rustls-platform-verifier:0.1.1"

    implementation "androidx.appcompat:appcompat:1.6.1"
}
